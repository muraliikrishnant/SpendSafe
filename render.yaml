services:
  - type: web
    name: spendsafe-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Set this to your GitHub Pages URL after the first deploy.
      - key: ALLOWED_ORIGINS
        value: https://muraliikrishnant.github.io
      # Optional: enables plain-English question parsing. Leave unset and the
      # front end reads the number out of the text itself.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_TEXT_MODEL
        value: openai/gpt-oss-20b
      - key: PYTHON_VERSION
        value: "3.11"
